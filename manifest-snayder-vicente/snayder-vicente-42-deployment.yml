apiVersion: apps/v1
kind: Deployment
metadata:
  name: snayder-vicente-42-deployment
  namespace: snayder-vicente-42-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snayder-vicente-42-deployment
  template:
    metadata:
      labels:
        app: snayder-vicente-42-deployment
    spec:
      containers:
      - name: snayder-vicente-42-container
        image: snaydervicente/as241s5_aej42-be:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: snayder-vicente-42-secret